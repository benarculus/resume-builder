name: Validate resume-builder

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install system OCR and document-conversion dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libreoffice
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install SPDX validation dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-spdx-validation.txt
      - name: Run structural validation
        run: python scripts/validate_repo.py
      - name: Run pytest
        run: env -u PYTEST_ADDOPTS GITHUB_ACTIONS=true pytest -q
