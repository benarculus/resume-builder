name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    # Use a PAT/App identity so release-please's generated Release PR is
    # authored by a non-GITHUB_TOKEN actor. GitHub blocks GITHUB_TOKEN-authored
    # pushes/PR updates from retriggering pull_request-scoped CI, so the only
    # reliable way to gate the Release PR through the normal branch protections
    # is to make the action run with a repository-scoped token that can trigger
    # the same CI checks on the generated PR.
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
